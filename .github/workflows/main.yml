name: DeepTech Multi-Agent Pipeline

on:
  workflow_dispatch: # Позволяет запускать агента вручную кнопкой в панели GitHub

permissions:
  contents: write # Дает агенту права на очистку мусорных .yml файлов и коммиты

jobs:
  run-multi-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ВАЖНО: 0 загружает ВСЮ историю репозитория (все 570 коммитов), чтобы агент изучил научные труды

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openai

      - name: Run Multi-Agent Script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python multi_agent.py
